name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run unit tests
        run: go test -v ./...

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Start CiviCRM stack
        run: docker compose up -d

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db mysqladmin ping -h 127.0.0.1 -u civicrm -ppass --silent && break
            echo "Waiting for DB... ($i/30)"
            sleep 5
          done

      - name: Install CiviCRM
        run: |
          # Wait until Apache inside the container is up
          for i in $(seq 1 30); do
            docker compose exec -T civi curl -sf http://localhost/ > /dev/null 2>&1 && break
            echo "Waiting for web server... ($i/30)"
            sleep 5
          done

          docker compose exec -T civi \
            cv core:install \
              --db="mysql://civicrm:pass@db:3306/civicrm" \
              -m "cmsBaseUrl=http://localhost:8760" \
              --lang=en_US \
              --force \
              -n

      - name: Create API key for admin user
        id: apikey
        run: |
          API_KEY=$(openssl rand -hex 16)

          # The installer creates exactly one UFMatch row (the admin user); get its contact_id
          CONTACT_ID=$(docker compose exec -T civi bash -c \
            'echo "{}" | cv api4 UFMatch.get --in=json --out=json-pretty' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["contact_id"])')

          # Set api_key directly on the contact record (CiviCRM 6.x stores it on civicrm_contact)
          docker compose exec -T civi bash -c \
            "echo '{\"records\":[{\"id\":${CONTACT_ID},\"api_key\":\"${API_KEY}\"}]}' \
             | cv api4 Contact.save --in=json --out=json-pretty"

          echo "CIVICRM_API_KEY=${API_KEY}" >> "$GITHUB_OUTPUT"

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          CIVICRM_URL: "http://localhost:8760"
          CIVICRM_API_KEY: ${{ steps.apikey.outputs.CIVICRM_API_KEY }}
        run: go test -v -timeout 30m ./internal/provider/...

      - name: Stop CiviCRM stack
        if: always()
        run: docker compose down -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  # Build for multiple platforms — only runs after acceptance tests pass
  build-matrix:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [build, acceptance-tests, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -o terraform-provider-civicrm.exe
          else
            go build -o terraform-provider-civicrm
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-civicrm_${{ matrix.os }}_${{ matrix.arch }}
          path: terraform-provider-civicrm*
          retention-days: 7
